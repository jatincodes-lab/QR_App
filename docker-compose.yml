services:
  api:
    build:
      context: .
      dockerfile: src/backend/QRApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=QRApp;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Your_strong_password_123};TrustServerCertificate=True;
      Redis__ConnectionString: redis:6379
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
      - redis

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:-Your_strong_password_123}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sqlserver-data:

